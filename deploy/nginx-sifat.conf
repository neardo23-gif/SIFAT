# nginx: /etc/nginx/sites-available/sifat  (enlázalo en sites-enabled)
# Cambia sifat.example.com por tu dominio. El certificado lo genera certbot:
#   sudo certbot --nginx -d sifat.example.com

server {
    listen 80;
    listen [::]:80;
    server_name sifat.example.com;
    # Todo el tráfico va a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sifat.example.com;

    ssl_certificate     /etc/letsencrypt/live/sifat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sifat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Formularios pequeños: no hay subida de archivos
    client_max_body_size 64k;
    server_tokens off;

    # Archivos estáticos directo desde disco, con caché
    location /static/ {
        alias /opt/sifat/front/static/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        # Necesarias con TRUST_PROXY=true para conocer la IP real (límite de intentos)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # El backend (127.0.0.1:8000) NO se publica: solo el front lo consulta.
}
