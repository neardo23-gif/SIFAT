<!doctype html>
<html lang="es" class="bg-ink">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}SIFAT{% endblock %}</title>
  <meta name="description" content="SIFAT: sistema de facturación con catálogo de servicios.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-ink font-sans text-[#f2f2f2] antialiased">
  <a href="#contenido" class="skip-link">Saltar al contenido</a>
  {% block body %}{% endblock %}
  <div id="toasts" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
